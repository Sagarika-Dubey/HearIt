<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Voice</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Page Voice</h1>
            <div class="status" id="status">Ready</div>

            <button id="openViewerBtn" class="primary-btn"
                style="display: none; background-color: #f59e0b; margin-bottom: 10px;">
                Open in HearIt Reader
            </button>
        </header>

        <div class="player-card">
            <div class="playback-controls">
                <button id="prevBtn" class="btn icon-only secondary" aria-label="Previous">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 20L9 12l10-8v16zM5 19V5h2v14H5z"></path>
                    </svg>
                </button>

                <!-- Play/Pause/Resume Wrapper -->
                <div class="main-action">
                    <button id="playBtn" class="btn icon-only primary big" aria-label="Play">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </button>
                    <button id="pauseBtn" class="btn icon-only primary big" aria-label="Pause" disabled
                        style="display: none;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                    <button id="resumeBtn" class="btn icon-only primary big" aria-label="Resume" disabled
                        style="display: none;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </button>
                </div>

                <button id="nextBtn" class="btn icon-only secondary" aria-label="Next">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 4l10 8-10 8V4zM19 5v14h-2V5h2z"></path>
                    </svg>
                </button>
            </div>

            <div class="action-controls">
                <button id="stopBtn" class="btn text-btn danger" aria-label="Stop" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    </svg>
                    <span>Stop</span>
                </button>
                <button id="markBtn" class="btn text-btn secondary" aria-label="Mark Important" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Mark</span>
                </button>
            </div>
        </div>

        <div class="settings">
            <div class="setting-item">
                <label for="voiceSelect">Voice</label>
                <select id="voiceSelect" class="voice-select">
                    <option value="">Default</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="rate">Speed: <span id="rateValue">1.0</span>x</label>
                <input type="range" id="rate" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
