<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HearIt PDF Reader</title>
    <link rel="stylesheet" href="viewer.css">
    <script src="../lib/pdf.min.js"></script>
    <script src="../scripts/content.js"></script>
    <script src="viewer.js" defer></script>
</head>

<body>
    <div id="toolbar">
        <div class="toolbar-left">
            <span id="page-info">Page <span id="page-num">--</span> / <span id="page-count">--</span></span>
        </div>
        <div class="toolbar-center">HearIt Reader</div>
        <div class="toolbar-right">
            <!-- Add zoom or other controls later if needed -->
        </div>
    </div>

    <div id="viewer-container">
        <div id="viewer" class="pdfViewer"></div>
    </div>

    <!-- Error container -->
    <div id="error-message" style="display: none; color: red; padding: 20px; text-align: center;"></div>
</body>

</html>
